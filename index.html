<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>ОРВИ 2027 — Калькулятор</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/main.css" />
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Прогноз ОРВИ на 2027 год</h1>
      <p class="subtitle">
        Байесовская модель с сезонностью Москвы и персональными факторами
      </p>

      <div class="panel">
        <h3 style="margin-top: 0">Ваши данные</h3>

        <div class="lambda-box">
          Популяционное среднее: <b id="prior_out">2.00</b><br />
          С учётом вашей истории: <b id="lambda_out">2.00</b> за год
        </div>

        <label>Возраст</label>
        <input type="number" id="age" value="41" min="1" max="100" />

        <label>Пол</label>
        <select id="sex">
          <option value="m">Мужской</option>
          <option value="f">Женский</option>
        </select>

        <label>Регион</label>
        <select id="region">
          <option value="moscow" selected>Москва</option>
          <option value="spb">Санкт-Петербург</option>
          <option value="other">Другой</option>
        </select>

        <label>Режим работы</label>
        <select id="work">
          <option value="office" selected>Очно 5 дней</option>
          <option value="hybrid">Гибрид</option>
          <option value="remote">Удалённо</option>
        </select>

        <label>Транспорт, дней в неделю</label>
        <div class="row">
          <input type="range" id="transport" min="0" max="7" value="5" /><span
            class="val"
            id="transport_v"
            >5</span
          >
        </div>

        <label>Дети в доме</label>
        <select id="kids">
          <option value="0" selected>Нет</option>
          <option value="1">Да</option>
        </select>

        <label>Хронические болезни</label>
        <select id="chronic">
          <option value="0" selected>Нет</option>
          <option value="1">Да</option>
        </select>

        <label>Прививка от гриппа</label>
        <select id="vaccine">
          <option value="1" selected>Да</option>
          <option value="0">Нет</option>
        </select>

        <label>Курение</label>
        <select id="smoke">
          <option value="0" selected>Нет</option>
          <option value="1">Да</option>
        </select>

        <label>Сон (часов)</label>
        <div class="row">
          <input
            type="range"
            id="sleep"
            min="4"
            max="10"
            value="8"
            step="0.5"
          /><span class="val" id="sleep_v">8</span>
        </div>

        <label>Уровень стресса</label>
        <select id="stress">
          <option value="low">Низкий</option>
          <option value="mid" selected>Средний</option>
          <option value="high">Высокий</option>
        </select>

        <label>Сколько раз вы болели ОРВИ за последние годы</label>
        <div id="history_inputs"></div>
        <button type="button" id="addYear" style="margin-top: 6px">
          + Добавить год
        </button>
      </div>

      <div class="panel">
        <div style="margin-bottom: 12px; font-size: 14px">
          <strong>Верхний график:</strong>
          <label
            style="
              display: inline-block;
              margin-left: 12px;
              margin-right: 20px;
              cursor: pointer;
            "
          >
            <input type="radio" name="chartMode" value="pmf" checked />
            Ровно k раз
          </label>
          <label style="display: inline-block; cursor: pointer">
            <input type="radio" name="chartMode" value="cdf" />
            Хотя бы k раз
          </label>
        </div>

        <div id="chart_count" style="width: 100%; height: 340px"></div>

        <div style="margin: 16px 0 12px; font-size: 14px">
          <strong>Нижний график:</strong>
          <label
            style="
              display: inline-block;
              margin-left: 12px;
              margin-right: 20px;
              cursor: pointer;
            "
          >
            <input type="radio" name="seasonMode" value="total" checked />
            Сумма
          </label>
          <label style="display: inline-block; cursor: pointer">
            <input type="radio" name="seasonMode" value="viruses" />
            По вирусам
          </label>
        </div>

        <div id="chart_daily" style="width: 100%; height: 380px"></div>
        <div
          id="chart_viral"
          style="width: 100%; height: 380px; display: none"
        ></div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
