<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ОРВИ 2027 — Калькулятор</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f6f7f9; color: #222; }
  .container { display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; }
  .panel { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  h1 { grid-column: 1 / -1; font-size: 24px; margin: 0; }
  .subtitle { grid-column: 1 / -1; color: #666; margin: 0 0 8px; }
  label { display: block; font-size: 13px; color: #444; margin: 10px 0 4px; }
  select, input[type=number] { width: 100%; padding: 8px; border: 1px solid #d0d5dc; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
  input[type=range] { width: 100%; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .val { font-variant-numeric: tabular-nums; color: #1f6feb; font-weight: 600; min-width: 24px; text-align: right; }
  .lambda-box { background: #eef4ff; border-radius: 8px; padding: 12px; margin-top: 14px; font-size: 14px; }
  .lambda-box b { color: #1f6feb; font-size: 20px; }
  @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <h1>Прогноз ОРВИ на 2027 год</h1>
  <p class="subtitle">Байесовская модель с сезонностью Москвы и персональными факторами</p>

  <div class="panel">
    <h3 style="margin-top:0">Ваши данные</h3>

    <label>Возраст</label>
    <input type="number" id="age" value="41" min="1" max="100">

    <label>Пол</label>
    <select id="sex"><option value="m">Мужской</option><option value="f">Женский</option></select>

    <label>Регион</label>
    <select id="region">
      <option value="moscow" selected>Москва</option>
      <option value="spb">Санкт-Петербург</option>
      <option value="other">Другой</option>
    </select>

    <label>Режим работы</label>
    <select id="work">
      <option value="office" selected>Очно 5 дней</option>
      <option value="hybrid">Гибрид</option>
      <option value="remote">Удалённо</option>
    </select>

    <label>Транспорт, дней в неделю</label>
    <div class="row"><input type="range" id="transport" min="0" max="7" value="5"><span class="val" id="transport_v">5</span></div>

    <label>Дети в доме</label>
    <select id="kids"><option value="0" selected>Нет</option><option value="1">Да</option></select>

    <label>Хронические болезни</label>
    <select id="chronic"><option value="0" selected>Нет</option><option value="1">Да</option></select>

    <label>Прививка от гриппа</label>
    <select id="vaccine"><option value="1" selected>Да</option><option value="0">Нет</option></select>

    <label>Курение</label>
    <select id="smoke"><option value="0" selected>Нет</option><option value="1">Да</option></select>

    <label>Сон (часов)</label>
    <div class="row"><input type="range" id="sleep" min="4" max="10" value="8" step="0.5"><span class="val" id="sleep_v">8</span></div>

    <label>Уровень стресса</label>
    <select id="stress">
      <option value="low">Низкий</option>
      <option value="mid" selected>Средний</option>
      <option value="high">Высокий</option>
    </select>

    <div class="lambda-box">
      Ожидаемое число эпизодов: <b id="lambda_out">2.00</b> за год
    </div>
  </div>

  <div class="panel">
    <div id="chart_count" style="width:100%; height:340px;"></div>
    <div id="chart_daily" style="width:100%; height:380px; margin-top:10px;"></div>
  </div>
</div>

<script>
const MONTH_W = [0.10,0.15,0.10,0.08,0.06,0.04,0.03,0.04,0.12,0.10,0.08,0.10];
const DIM = [31,28,31,30,31,30,31,31,30,31,30,31];

function computeLambda() {
  const g = id => document.getElementById(id).value;
  const n = id => +document.getElementById(id).value;
  let lam = 2.0;
  const age = n('age');
  if (age < 18) lam *= 1.6; else if (age >= 60) lam *= 1.25;
  if (g('sex') === 'f') lam *= 1.05;
  if (g('region') === 'spb') lam *= 1.1; else if (g('region') === 'other') lam *= 0.9;
  if (g('work') === 'hybrid') lam *= 0.85; else if (g('work') === 'remote') lam *= 0.6;
  lam *= 0.7 + 0.1 * n('transport');
  if (n('kids')) lam *= 1.5;
  if (n('chronic')) lam *= 1.35;
  if (!n('vaccine')) lam *= 1.15;
  if (n('smoke')) lam *= 1.2;
  const sl = n('sleep');
  if (sl < 6) lam *= 1.3; else if (sl < 7) lam *= 1.1;
  const st = g('stress');
  if (st === 'high') lam *= 1.2; else if (st === 'low') lam *= 0.9;
  return Math.max(0.1, lam);
}

function seasonalDaily() {
  const total = MONTH_W.reduce((a,b)=>a+b,0);
  const out = [];
  for (let m = 0; m < 12; m++) {
    const perDay = MONTH_W[m] / DIM[m] / total;
    for (let d = 0; d < DIM[m]; d++) out.push(perDay);
  }
  return out;
}

function negBinomPMF(k, r, p) {
  let logC = 0;
  for (let i = 1; i <= k; i++) logC += Math.log(r + i - 1) - Math.log(i);
  return Math.exp(logC + r * Math.log(p) + k * Math.log(1 - p));
}

// Приблизительный квантиль Gamma (Wilson-Hilferty)
function gammaQuantile(shape, p) {
  const z = normQ(p);
  const c = 1 - 1/(9*shape) + z/(3*Math.sqrt(shape));
  return shape * c * c * c;
}
// Квантиль нормального (Beasley-Springer-Moro)
function normQ(p) {
  const a=[-3.969683028665376e1,2.209460984245205e2,-2.759285104469687e2,1.38357751867269e2,-3.066479806614716e1,2.506628277459239];
  const b=[-5.447609879822406e1,1.615858368580409e2,-1.556989798598866e2,6.680131188771972e1,-1.328068155288572e1];
  const c=[-7.784894002430293e-3,-3.223964580411365e-1,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783];
  const d=[7.784695709041462e-3,3.224671290700398e-1,2.445134137142996,3.754408661907416];
  const pl=0.02425, ph=1-pl;
  let q,r;
  if (p<pl){q=Math.sqrt(-2*Math.log(p));return((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if (p>ph){q=Math.sqrt(-2*Math.log(1-p));return-((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  q=p-0.5;r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}

function update() {
  const lam = computeLambda();
  document.getElementById('lambda_out').textContent = lam.toFixed(2);

  // Gamma prior: mean=lam, CV=0.5 → alpha, beta
  const cv = 0.5, sigma2 = (lam*cv)**2;
  const alpha = lam*lam/sigma2, beta = lam/sigma2, p_nb = beta/(beta+1);

  const ks=[], pmf=[], lo=[], hi=[];
  const aLo = gammaQuantile(alpha, 0.025);
  const aHi = gammaQuantile(alpha, 0.975);
  for (let k = 0; k <= 12; k++) {
    ks.push(k);
    pmf.push(negBinomPMF(k, alpha, p_nb));
    lo.push(negBinomPMF(k, aLo, p_nb));
    hi.push(negBinomPMF(k, aHi, p_nb));
  }

  Plotly.react('chart_count', [
    { x: ks, y: pmf, type: 'bar', name: 'P(N=k)',
      marker: { color: '#1f6feb', line: { color: '#1558c0', width: 1 } },
      hovertemplate: 'k=%{x}<br>P=%{y:.4f}<extra></extra>' },
    { x: ks, y: lo, type: 'scatter', mode: 'lines', name: '2.5%', line: { color: '#f0a020', dash: 'dash', width: 1 }, hoverinfo: 'skip' },
    { x: ks, y: hi, type: 'scatter', mode: 'lines', name: '97.5%', line: { color: '#f0a020', dash: 'dash', width: 1 }, hoverinfo: 'skip' }
  ], {
    title: { text: 'Распределение числа эпизодов ОРВИ за 2027', font: { size: 15 } },
    xaxis: { title: 'Число эпизодов', dtick: 1 },
    yaxis: { title: 'Вероятность', tickformat: '.1%' },
    margin: { l: 60, r: 20, t: 50, b: 50 },
    legend: { orientation: 'h', y: -0.2 },
    plot_bgcolor: '#fafbfc', paper_bgcolor: '#fff'
  }, { responsive: true });

  const daily = seasonalDaily();
  const days=[], haz=[], hLo=[], hHi=[];
  const start = new Date(2027,0,1);
  const lamLo = gammaQuantile(alpha, 0.025)/beta;
  const lamHi = gammaQuantile(alpha, 0.975)/beta;
  for (let i = 0; i < 365; i++) {
    days.push(new Date(start.getTime() + i*86400000).toISOString().slice(0,10));
    haz.push(lam * daily[i]);
    hLo.push(lamLo * daily[i]);
    hHi.push(lamHi * daily[i]);
  }

  Plotly.react('chart_daily', [
    { x: days, y: hLo, type: 'scatter', mode: 'lines', name: '2.5%', line: { color: '#f0a020', dash: 'dot', width: 1 }, hoverinfo: 'skip' },
    { x: days, y: hHi, type: 'scatter', mode: 'lines', name: '97.5%', line: { color: '#f0a020', dash: 'dot', width: 1 }, hoverinfo: 'skip' },
    { x: days, y: haz, type: 'scatter', mode: 'lines', name: 'Средняя',
      line: { color: '#1f6feb', width: 2 }, fill: 'tozeroy', fillcolor: 'rgba(31,111,235,0.12)' }
  ], {
    title: { text: 'Вероятность начала эпизода по дням (λ и 95% интервал)', font: { size: 15 } },
    xaxis: { title: 'Дата', type: 'date' },
    yaxis: { title: 'Вероятность в день', tickformat: '.2%' },
    margin: { l: 70, r: 20, t: 50, b: 50 },
    legend: { orientation: 'h', y: -0.2 },
    plot_bgcolor: '#fafbfc', paper_bgcolor: '#fff'
  }, { responsive: true });
}

['transport','sleep'].forEach(id => {
  const el = document.getElementById(id);
  document.getElementById(id + '_v').textContent = el.value;
  el.addEventListener('input', () => document.getElementById(id + '_v').textContent = el.value);
});
document.querySelectorAll('input, select').forEach(el => el.addEventListener('change', update));
document.querySelectorAll('input[type=range]').forEach(el => el.addEventListener('input', update));
update();
</script>
</body>
</html>
